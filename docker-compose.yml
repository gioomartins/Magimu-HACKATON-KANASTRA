services:
  db:
    image: postgres:17-alpine
    container_name: antecipe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antecipe}
      POSTGRES_USER: ${POSTGRES_USER:-antecipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antecipe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - antecipe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  antecipe_pgdata:
