[project]
name = "antecipe-backend"
version = "0.1.0"
description = "Antecipe - backoffice de antecipação de recebíveis (Hackathon Kanastra 2026)"
authors = [
    { name = "ThwyIgo", email = "thiagopachecorocha@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[tool.uv]
# Aplicação Django (não é um pacote distribuível): sem build-system.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
