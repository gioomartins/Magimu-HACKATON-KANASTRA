name: CI/CD Pipeline - Antecipe

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend - Testes Unitários
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: antecipe
          POSTGRES_PASSWORD: antecipe
          POSTGRES_DB: antecipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Executar migrações
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: antecipe
          POSTGRES_PASSWORD: antecipe
          POSTGRES_DB: antecipe
          DJANGO_SECRET_KEY: ci-secret-key-12345
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Rodar Testes Unitários do Django
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: antecipe
          POSTGRES_PASSWORD: antecipe
          POSTGRES_DB: antecipe
          DJANGO_SECRET_KEY: ci-secret-key-12345
        run: |
          cd backend
          python manage.py test core --noinput

  frontend-build:
    name: Frontend - Build e Validação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Executar Build do Next.js
        run: |
          cd frontend
          npm run build
